<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Where is this Williams College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page reset-password-page">
    <main class="login-shell">
        <section class="login-card">
            <img class="login-logo" src="assests/photos/potential-logo.png" alt="Where Is This Williams College" />
            <form class="player-card login-form" id="reset-password-form">
                <label id="reset-email-label">
                    Williams email
                    <input id="reset-email-input" name="email" type="email" autocomplete="email" placeholder="abc1@williams.edu" required />
                </label>
                <label id="new-password-label" class="hidden">
                    New password
                    <input id="new-password-input" name="password" type="password" autocomplete="new-password" placeholder="New password" minlength="8" />
                </label>
                <div class="login-actions">
                    <button class="primary-button login-submit" id="reset-password-button" type="submit">Send Reset Link</button>
                    <a class="secondary-button login-submit login-text-link" href="login.html">Back to Log In</a>
                </div>
            </form>
            <p class="player-status" id="reset-password-status"></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
