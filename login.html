<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Where is this Williams College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" id="login-screen">
            <img class="login-logo" src="assests/photos/potential-logo.png" alt="Where Is This Williams College" />
            <form class="player-card login-form" id="player-form">
                <label>
                    Williams email
                    <input id="email-input" name="email" type="email" autocomplete="email" placeholder="abc1@williams.edu" required />
                </label>
                <label class="hidden">
                    Instagram username
                    <input id="instagram-input" name="instagram" type="text" autocomplete="username" placeholder="@ephs_everywhere" />
                </label>
                <div class="login-actions">
                    <button class="primary-button login-submit" id="save-player-button" type="submit">Continue</button>
                </div>
            </form>
            <p class="player-status" id="player-status"></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
