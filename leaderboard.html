<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | Where is this Williams College</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="leaderboard-page requires-player auth-pending">
    <header class="about-site">
        <a href="index.html" class="site-logo" aria-label="Where is this Williams home">
            <img src="assests/photos/williamscollegelogo.avif" alt="Williams College" />
        </a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="achievements.html">Achievements</a>
            <a href="posts.html">Posts</a>

            <a href="history.html">History</a>
